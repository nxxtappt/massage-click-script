<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico?v=1" sizes="any">

<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="/favicon-32x32.png?v=1"
>

<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="/favicon-16x16.png?v=1"
>

<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/apple-touch-icon.png?v=1"
>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextAppt Business Portal</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      background: #f6f8fb;
      color: #102033;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .portal-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 18px;
    }

    .portal-hero {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      margin-bottom: 20px;
    }

    .portal-card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d7dee8;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .status-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #eef6ff;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .helper-text {
      color: #526070;
      line-height: 1.5;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <main class="portal-wrap">
    <section class="portal-hero">
      <h1>Claim Your Business</h1>
      <p class="helper-text">
        Submit a claim request so our team can verify ownership. Once approved,
        you’ll be able to manage your profile and connect live availability.
      </p>
    </section>

    <section class="portal-card">
      <h2>Business Claim Request</h2>

      <label>Business</label>
      <select id="claimBusinessSelect"></select>

      <label>Your Name</label>
      <input id="claimOwnerName" placeholder="Owner or manager name" />

      <label>Your Email</label>
      <input id="claimOwnerEmail" placeholder="you@business.com" />

      <label>Your Phone</label>
      <input id="claimOwnerPhone" placeholder="Optional" />

      <label>Note</label>
      <textarea id="claimNote" placeholder="Tell us anything helpful for verification."></textarea>

      <button id="submitClaimBtn">Submit Claim</button>

      <div id="claimStatus" class="status-box"></div>
    </section>

    <div id="businessList" style="display:none;"></div>
  </main>

  <script src="/business.js"></script>
</body>
</html>

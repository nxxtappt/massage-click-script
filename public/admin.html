<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>NextAppt Admin Portal</title>
  <link rel="stylesheet" href="/admin.css?v=20260721-scheduler-v2" />
  <link rel="stylesheet" href="/admin-scheduler.css?v=20260721-scheduler-v2" />
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div>
          <h1>NextAppt</h1>
          <p>Admin Portal</p>
        </div>
      </div>

      <nav class="nav" aria-label="Admin navigation">
        <button class="nav-btn active" data-view="businesses" type="button">Businesses</button>
        <button class="nav-btn" data-view="inventory" type="button">Appointment Inventory</button>
        <button class="nav-btn" data-view="subscriptions" type="button">Business Subscriptions</button>
        <button class="nav-btn" data-view="claims" type="button">Business Claims</button>
        <button class="nav-btn" data-view="results" type="button">Latest Results</button>
        <button class="nav-btn" data-view="errors" type="button">Error Logs</button>
        <button class="nav-btn" data-view="schedules" type="button">Schedules</button>
        <button class="nav-btn" data-view="settings" type="button">Settings</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Businesses</h2>
          <p id="pageSubtitle">Search, create, and manage businesses, subscriptions, inventory, claims, and schedules.</p>
        </div>
        <button id="refreshBtn" class="primary-btn" type="button">Refresh</button>
      </header>

      <section id="statusBox" class="status-box" aria-live="polite">Admin portal loaded.</section>
      <section id="content" class="content-card"><p>Loading...</p></section>
    </main>
  </div>

  <script src="/admin.js?v=20260721-scheduler-v2"></script>
</body>
</html>

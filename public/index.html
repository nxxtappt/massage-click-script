<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Massage Appointments in Austin, TX | Live Availability | NextAppt.ai</title>

  <meta
    name="description"
    content="Search live massage appointment availability across Austin, Texas. Compare openings from local massage therapists and book your next massage with NextAppt.ai."
  />

  <meta
    name="keywords"
    content="massage Austin, massage appointments Austin, massage near me, massage availability, deep tissue massage Austin, sports massage Austin, prenatal massage Austin, massage booking"
  />

  <meta name="robots" content="index,follow" />

  <link rel="canonical" href="https://nextappt.ai/austin/massage" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="NextAppt.ai" />
  <meta property="og:title" content="Massage Appointments in Austin, TX | Live Availability" />
  <meta
    property="og:description"
    content="Find live massage appointment openings throughout Austin, Texas."
  />
  <meta property="og:url" content="https://nextappt.ai/austin/massage" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta
    name="twitter:title"
    content="Massage Appointments in Austin, TX | Live Availability"
  />
  <meta
    name="twitter:description"
    content="Search live massage appointment availability across Austin with NextAppt.ai."
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">NextAppt.ai</p>

      <h1 id="heroTitle">Tell us what appointment you need.</h1>

      <p id="heroSubtitle">
        Ask for massage availability by service, time, duration, location, or urgency.
      </p>
    </section>

    <section class="chat-panel">
      <form id="chatSearchForm" class="chat-search-form">
        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Example: I need a prenatal massage tomorrow between 2 and 6..."
        />

        <button id="searchLiveBtn" type="submit">Search</button>
      </form>

      <div id="assistantResponse" class="assistant-response">
        <div class="assistant-bubble">
          Hi — tell me what kind of appointment you need, or browse the fresh openings below.
        </div>
      </div>

      <div id="liveSearchResults" class="live-search-results"></div>
    </section>

    <section class="summary">
      <p id="resultsSummary">Loading fresh appointments...</p>
    </section>

    <section class="content-layout">
      <section id="appointmentsGrid" class="appointments-list"></section>

      <aside class="map-panel">
        <div id="map"></div>
      </aside>
    </section>
  </main>

  <select id="businessFilter" class="hidden-control">
    <option value="">All businesses</option>
  </select>

  <button id="clearFiltersBtn" class="hidden-control" type="button">
    Clear
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
